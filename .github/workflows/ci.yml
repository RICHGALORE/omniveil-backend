name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile production proof runners
        run: |
          python -m py_compile scripts/production_proof.py
          python -m py_compile scripts/production_forensic_proof.py

      - name: Run test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./omniveil-ci.db
        run: python -m pytest -q

      - name: Diagnostic live readiness probe
        if: github.event_name == 'pull_request'
        run: |
          set +e
          echo "--- /health ---"
          curl -sS -m 30 -w '\nHTTP_STATUS:%{http_code}\n' https://omniveil-backend.onrender.com/health
          echo "--- /ready ---"
          curl -sS -m 30 -w '\nHTTP_STATUS:%{http_code}\n' https://omniveil-backend.onrender.com/ready
          exit 0
